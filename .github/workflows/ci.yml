name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  test:
    name: Test (nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CI deps (protoc + native CLI tools for tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ripgrep fd-find
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test (nextest)
        # nextest runs each test binary in a separate process with better
        # parallelism + failure reporting than `cargo test`. Falls back to
        # `cargo test` for doc-tests which nextest doesn't support yet.
        # Default features only — ares feature requires path deps.
        run: |
          cargo nextest run --workspace --no-fail-fast
          cargo test --workspace --doc

  macos-tui-smoke:
    name: macOS TUI slash smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
      - name: Slash command return-key parity
        run: |
          cargo test -p pawan --lib test_slash_commands_dispatch_on_lf_enter_alias
          cargo test -p pawan --lib test_slash_model_dispatches_on_cr_enter_alias
          cargo test -p pawan --lib test_ctrl_m_does_not_toggle_model_picker_as_global_shortcut
          cargo test -p pawan --test tui_headless_tests slash_help_displays_registered_commands_with_lf_enter_in_real_pty -- --nocapture
          cargo test -p pawan --test tui_headless_tests slash_model_lf_enter_opens_picker_in_real_pty -- --nocapture

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Check docs
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # The shipped binaries are compiled by release.yml, which pins its own
  # toolchain. Every other job here runs @stable, so without this gate a
  # release compiler can break without any check noticing. #89.
  #
  # This job inherits the workflow's RUSTFLAGS: -D warnings, which the release
  # build does not set, so it is strictly stricter than what ships.
  release-toolchain:
    name: Release toolchain build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail before installing anything if release.yml moves to another
      # compiler: otherwise this gate would keep testing a version that no
      # longer ships, and the gap would reopen silently.
      - name: Assert this gate still matches release.yml
        run: |
          release_pin="$(grep -oE 'dtolnay/rust-toolchain@[0-9][0-9.]*' .github/workflows/release.yml | head -1 | cut -d@ -f2)"
          gate_pin="1.94"
          if [ -z "$release_pin" ]; then
            echo "::error::could not read a pinned rust-toolchain out of release.yml"
            exit 1
          fi
          if [ "$release_pin" != "$gate_pin" ]; then
            echo "::error::release.yml builds with $release_pin but this gate tests $gate_pin"
            echo "::error::update both together, or the release compiler is ungated again"
            exit 1
          fi
          echo "gate matches release.yml: $gate_pin"

      - uses: dtolnay/rust-toolchain@1.94
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-toolchain

      - name: Build the shipped Linux binary on the release toolchain
        run: cargo build --release --target x86_64-unknown-linux-gnu -p pawan


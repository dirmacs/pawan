name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  test:
    name: Test (nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CI deps (protoc + native CLI tools for tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ripgrep fd-find
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test (nextest)
        # nextest runs each test binary in a separate process with better
        # parallelism + failure reporting than `cargo test`. Falls back to
        # `cargo test` for doc-tests which nextest doesn't support yet.
        # Default features only — ares feature requires path deps.
        run: |
          cargo nextest run --workspace --no-fail-fast
          cargo test --workspace --doc

  macos-tui-smoke:
    name: macOS TUI slash smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
      - name: Slash command return-key parity
        run: |
          cargo test -p pawan --lib test_slash_commands_dispatch_on_lf_enter_alias
          cargo test -p pawan --lib test_slash_model_dispatches_on_cr_enter_alias
          cargo test -p pawan --lib test_ctrl_m_does_not_toggle_model_picker_as_global_shortcut
          cargo test -p pawan --test tui_headless_tests slash_help_displays_registered_commands_with_lf_enter_in_real_pty -- --nocapture
          cargo test -p pawan --test tui_headless_tests slash_model_lf_enter_opens_picker_in_real_pty -- --nocapture

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Check docs
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # The shipped binaries are compiled by release.yml, which pins its own
  # toolchain. Every other job here runs @stable, so without this gate a
  # release compiler can break without any check noticing. #89.
  #
  # This job inherits the workflow's RUSTFLAGS: -D warnings, which the release
  # build does not set, so it is strictly stricter than what ships.
  release-toolchain:
    name: Release toolchain build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94
        with:
          targets: x86_64-unknown-linux-gnu

      # Compare the compiler that actually got installed against every pin in
      # release.yml. This runs after the install on purpose: reading rustc's
      # real version catches a drifted `uses:` ref, which comparing a second
      # hardcoded pin string would not.
      - name: Assert this gate is running the compiler release.yml ships
        run: |
          release_pins="$(grep -oE 'dtolnay/rust-toolchain@[0-9][0-9.]*' .github/workflows/release.yml | cut -d@ -f2 | sort -u)"
          distinct="$(printf '%s\n' "$release_pins" | grep -c '[0-9]')"
          if [ "$distinct" -eq 0 ]; then
            echo "::error::no pinned rust-toolchain found in release.yml"
            exit 1
          fi
          if [ "$distinct" -ne 1 ]; then
            echo "::error::release.yml pins $distinct different toolchains: $release_pins"
            echo "::error::build and publish must agree, or the gate cannot match one"
            exit 1
          fi
          # Compare major.minor only: rustc reports 1.94.0 where release.yml
          # pins 1.94, so a full triple comparison would never match.
          actual="$(rustc --version | grep -oE '[0-9]+\.[0-9]+')"
          if [ "$actual" != "$release_pins" ]; then
            echo "::error::this gate is running rustc $actual but release.yml ships $release_pins"
            echo "::error::update the gate and release.yml together, or the release compiler is ungated again"
            exit 1
          fi
          echo "gate is running $actual, matching release.yml"

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-toolchain

      - name: Build the shipped Linux binary on the release toolchain
        run: cargo build --release --target x86_64-unknown-linux-gnu -p pawan


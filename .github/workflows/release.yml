name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is empty; configure it before pushing release tags."
            exit 1
          fi

  verify-release-toolchain:
    name: Verify release toolchain
    runs-on: ubuntu-latest
    steps:
      # The shipped artifacts are compiled by 1.94, but CI validates the source
      # at floating @stable. Without this job the release compiler is the one
      # compiler nothing checks, so a release can ship code that never passed a
      # gate. This runs ci.yml's check/test gates under the release toolchain,
      # so a 1.94 incompatibility fails the release here instead of shipping.
      #
      # Scope of the mirror, stated precisely: this job runs ci.yml's `check`
      # gate commands (check/clippy/fmt) and ci.yml's `test` job's deps and
      # runner (protoc + ripgrep + fd-find, nextest, plus doc-tests). It does
      # NOT mirror ci.yml's macos-tui-smoke or its separate doc job, and it
      # runs only on ubuntu-latest -- this is not CI parity, it is a 1.94 gate.
      #
      # nextest is pinned to the version measured against this toolchain; an
      # unpinned `tool: nextest` installs whatever is latest at run time, so
      # this job could gate on a runner version nobody has verified on 1.94.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94

      - name: Install CI deps (protoc + native CLI tools for tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ripgrep fd-find
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - uses: Swatinem/rust-cache@v2

      - name: Confirm the release toolchain is actually 1.94
        run: |
          rustc --version
          if ! rustc --version | grep -q '^rustc 1\.94\.'; then
            echo "::error::expected rustc 1.94 for the release toolchain, got: $(rustc --version)"
            exit 1
          fi

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.137

      - name: Test
        # Mirrors ci.yml's test job step for step, including the runner: nextest
        # for the suite and `cargo test` for doc-tests, which nextest does not
        # cover. The deps above match ci.yml's too -- tests shell out to rg and
        # fd, and a runner without them fails for a reason that has nothing to
        # do with the release toolchain, which is exactly what this job must not do.
        run: |
          cargo nextest run --workspace --no-fail-fast
          cargo test --workspace --doc

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [preflight, verify-release-toolchain]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pawan-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pawan-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: pawan-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: pawan-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/bin/
          key: ${{ matrix.target }}-none
          restore-keys: ""

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler binutils gcc pkg-config

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Architectures:/d; /^Signed-By:/i Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross libssl-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Build
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: clang
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: clang
          LD: /usr/bin/ld
        run: |
          set +e
          export PATH="/usr/bin:$PATH"
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) export RUSTFLAGS="-C linker=aarch64-linux-gnu-gcc" ;;
            x86_64-unknown-linux-gnu) export RUSTFLAGS="-C linker=gcc" ;;
            x86_64-apple-darwin|aarch64-apple-darwin) export RUSTFLAGS="-C linker=clang" ;;
          esac
          echo "RUSTFLAGS=${RUSTFLAGS:-}"
          echo "---LINKER CONFIG---"
          which gcc 2>/dev/null && gcc --version | head -1
          which clang 2>/dev/null && clang --version | head -1
          which ld 2>/dev/null && ld --version | head -1
          which mold 2>/dev/null && mold --version
          echo "---CARGO BUILD START---"
          cargo build --release --target ${{ matrix.target }} -p pawan 2>&1 | tee /tmp/build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "---BUILD EXIT: $BUILD_EXIT---"
          cargo version
          rustc --version
          echo "---LAST 50 LINES---"
          tail -50 /tmp/build_output.txt
          echo "---RELEASE DIR---"
          ls -la target/${{ matrix.target }}/release/ 2>/dev/null || echo "No release directory"
          exit "$BUILD_EXIT"

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pawan dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94

      - name: Install protoc + build tools
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler binutils gcc pkg-config libssl-dev

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
          LD: /usr/bin/ld
        run: |
          export PATH="/usr/bin:$PATH"
          cargo publish -p pawan-core
          sleep 90
          cargo publish -p pawan-mcp
          sleep 30
          cargo publish -p pawan-aegis
          cargo publish -p pawan-api
          sleep 90
          cargo publish -p pawan

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/pawan-linux-amd64/pawan-linux-amd64
            artifacts/pawan-linux-arm64/pawan-linux-arm64
            artifacts/pawan-macos-amd64/pawan-macos-amd64
            artifacts/pawan-macos-arm64/pawan-macos-arm64

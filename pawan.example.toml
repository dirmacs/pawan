# Pawan configuration example
# Copy to pawan.toml in your project root and customize.
# See: https://github.com/dirmacs/pawan

# LLM provider: nvidia (default), ollama, openai
# provider = "nvidia"

# Model to use (provider-specific ID)
# Default: qwen/qwen3.5-122b-a10b (S tier on NVIDIA NIM)
model = "qwen/qwen3.5-122b-a10b"

# Generation parameters
temperature = 0.6
# top_p = 0.95
# max_tokens = 8192

# Maximum tool-calling iterations per prompt
# max_tool_iterations = 50

# Enable reasoning/thinking mode (auto-detected for DeepSeek, Gemma, Qwen, GLM, Mistral)
# reasoning_mode = true

# Cloud fallback model (used when primary fails)
# [cloud]
# provider = "nvidia"
# model = "minimaxai/minimax-m2.5"

# Self-healing settings
[healing]
fix_errors = true
fix_warnings = true
fix_tests = true
auto_commit = false

# Tool permission overrides (allow / deny / prompt)
# "allow"  — always execute (default for all tools)
# "deny"   — never execute, returns error to LLM
# "prompt" — ask before executing; read-only bash commands auto-allowed
# [permissions]
# bash = "prompt"         # Prompt before write commands, auto-allow reads (ls, cat, grep, git status)
# write_file = "prompt"   # Prompt before writing files
# edit_file_lines = "prompt"
# git_commit = "deny"     # Disable committing entirely
# read_file = "allow"     # Always allow (default)

# TUI settings
[tui]
syntax_highlighting = true
mouse_support = true
scroll_speed = 3

# MCP servers
# [mcp.daedra]
# command = "daedra"
# args = ["serve", "--transport", "stdio", "--quiet"]

# OpenAPPA guardrail — the embedded information-flow engine wired at the
# tool-execution seam. OFF by default: with this section absent (or
# `enabled = false`) pawan runs its permission gates alone. When enabled,
# every tool call crosses a pre-call check and every result a post-call
# check; a call the policy denies never reaches the tool's execute path,
# and a withheld result never reaches the model. A policy that cannot be
# read or composed fails CLOSED — every tool call stops.
#
# The policy documents are TOML in the OpenAPPA vocabulary; the test
# document (config/appa.test.toml) and the CI gate (scripts/appa-gate.sh)
# show the shape. Batteries are hosted annotator/sanitizer/directory
# services: an unanswered battery is an operational refuse, never an allow.
# [appa]
# enabled = true
# policy_path = "config/appa.test.toml"
# timeout_ms = 3000
# max_body_bytes = 65536
# [[appa.batteries]]
# name = "pawan"
# policy_path = "config/appa.battery.toml"
# token_env = ["APPA_BATTERY_TOKEN"]
